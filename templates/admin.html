<div id="debug-console" style="background: #000; color: #00ff00; font-family: monospace; font-size: 12px; padding: 15px; height: 150px; overflow-y: auto; border-top: 2px solid #38bdf8; margin-top: 20px;">
    <div>> Initialisation du système...</div>
</div>

<script>
    // Fonction pour écrire dans notre console personnalisée
    function logDebug(message, isError = false) {
        const consoleDiv = document.getElementById('debug-console');
        const time = new Date().toLocaleTimeString();
        const color = isError ? '#ff4444' : '#00ff00';
        consoleDiv.innerHTML += `<div style="color: ${color}">[${time}] ${message}</div>`;
        consoleDiv.scrollTop = consoleDiv.scrollHeight; // Scroll automatique vers le bas
    }

    // On remplace la fonction addUser par celle-ci pour voir les erreurs
    async function addUser() {
        logDebug("Tentative d'ajout d'utilisateur...");
        const nom = document.getElementById('u-nom').value;
        const pin = document.getElementById('u-pin').value;
        const role = document.getElementById('u-role').value;

        if(!nom || !pin) {
            logDebug("Erreur : Nom ou PIN manquant", true);
            return alert("Remplissez le nom et le code PIN");
        }

        try {
            const res = await fetch('/api/admin/users', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({ nom, username: nom, password: pin, role }) 
            });

            const result = await res.json();
            
            if(res.ok) {
                logDebug(`Succès : Profil ${nom} créé !`);
                loadUsers();
            } else {
                logDebug(`Erreur Serveur : ${result.message}`, true);
            }
        } catch (err) {
            logDebug(`Erreur Réseau : ${err.message}`, true);
        }
    }

    // Applique la même logique à loadUsers pour voir si le chargement échoue
    async function loadUsers() {
        try {
            const res = await fetch('/api/admin/users');
            if(!res.ok) throw new Error("Impossible de lire la liste des utilisateurs");
            const data = await res.json();
            logDebug(`${data.length} utilisateurs chargés.`);
            
            const tbody = document.getElementById('table-users-body');
            tbody.innerHTML = "";
            data.forEach(u => {
                tbody.innerHTML += `<tr>
                    <td>${u.nom_complet}</td>
                    <td>${u.role}</td>
                    <td>${u.password_hash}</td>
                    <td><button class="btn-action btn-danger" onclick="deleteUser(${u.id})">X</button></td>
                </tr>`;
            });
        } catch (err) {
            logDebug(err.message, true);
        }
    }
</script>
