<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GMAO - Administration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .admin-nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-tab { padding: 10px 20px; background: #1a1f26; color: #8b949e; border-radius: 8px; cursor: pointer; border: 1px solid #333; }
        .nav-tab.active { background: #38bdf8; color: black; font-weight: bold; border-color: #38bdf8; }
        .tab-content { display: none; background: #1a1f26; padding: 20px; border-radius: 12px; border: 1px solid #333; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; color: #38bdf8; padding: 12px; border-bottom: 2px solid #333; font-size: 0.8rem; }
        td { padding: 12px; border-bottom: 1px solid #222; }
        #debug-console { background: #000; color: #0f0; font-family: monospace; font-size: 11px; padding: 10px; height: 100px; overflow-y: auto; border: 1px solid #444; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="main-container" style="max-width: 1100px;">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>ADMINISTRATION</h1>
            <button onclick="window.location.href='/'">QUITTER</button>
        </header>

        <div class="admin-nav">
            <div class="nav-tab active" onclick="openTab(event, 'equipe')">EQUIPE</div>
            <div class="nav-tab" onclick="openTab(event, 'lignes')">LIGNES</div>
            <div class="nav-tab" onclick="openTab(event, 'inter')">INTERVENTIONS</div>
        </div>

        <div id="equipe" class="tab-content active">
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <input type="text" id="u-nom" placeholder="Nom">
                <input type="text" id="u-pin" placeholder="Code PIN">
                <select id="u-role"><option value="referent">Référent</option><option value="technicien">Technicien</option></select>
                <button onclick="addUser()">AJOUTER</button>
            </div>
            <table><thead><tr><th>Nom</th><th>Rôle</th><th>Code</th><th>Action</th></tr></thead><tbody id="table-users"></tbody></table>
        </div>

        <div id="lignes" class="tab-content">
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <input type="text" id="l-nom" placeholder="Nom de la ligne">
                <button onclick="addLigne()">CREER LIGNE</button>
            </div>
            <ul id="list-lignes" style="list-style:none; padding:0;"></ul>
        </div>

        <div id="inter" class="tab-content">
            <button onclick="window.location.href='/api/export_csv'" style="background:#f59e0b; color:white;">📥 EXPORTER (.CSV)</button>
            <table><thead><tr><th>Date</th><th>Ligne</th><th>Machine</th><th>Actions</th></tr></thead><tbody id="table-inter"></tbody></table>
        </div>

        <div id="debug-console">>> Console prête.</div>
    </div>

    <script>
        function log(m, e=false) { const c = document.getElementById('debug-console'); c.innerHTML += `<div style="color:${e?'red':'#0f0'}">>> ${m}</div>`; c.scrollTop = c.scrollHeight; }
        function openTab(evt, t) { 
            document.querySelectorAll(".tab-content").forEach(x => x.classList.remove("active"));
            document.querySelectorAll(".nav-tab").forEach(x => x.classList.remove("active"));
            document.getElementById(t).classList.add("active"); evt.currentTarget.classList.add("active");
        }

        async function loadLignes() {
            const res = await fetch('/api/lignes');
            const data = await res.json();
            const list = document.getElementById('list-lignes');
            list.innerHTML = "";
            data.forEach(l => {
                list.innerHTML += `<li style="padding:10px; border-bottom:1px solid #333; display:flex; justify-content:space-between;">${l.nom_ligne} <button onclick="deleteLigne(${l.id})">Supprimer</button></li>`;
            });
            log(data.length + " lignes chargées.");
        }

        async function addLigne() {
            const nom = document.getElementById('l-nom').value;
            await fetch('/api/lignes', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({nom}) });
            document.getElementById('l-nom').value = ""; loadLignes();
        }

        async function deleteLigne(id) { await fetch(`/api/lignes/${id}`, { method: 'DELETE' }); loadLignes(); }

        async function loadUsers() {
            const res = await fetch('/api/admin/users');
            const data = await res.json();
            const tb = document.getElementById('table-users'); tb.innerHTML = "";
            data.forEach(u => { tb.innerHTML += `<tr><td>${u.nom_complet}</td><td>${u.role}</td><td>${u.password_hash}</td><td><button onclick="deleteUser(${u.id})">X</button></td></tr>`; });
        }

        async function addUser() {
            const d = { nom: document.getElementById('u-nom').value, username: document.getElementById('u-nom').value, password: document.getElementById('u-pin').value, role: document.getElementById('u-role').value };
            await fetch('/api/admin/users', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(d) });
            loadUsers();
        }

        async function loadInter() {
            const res = await fetch('/api/historique_complet');
            const data = await res.json();
            const tb = document.getElementById('table-inter'); tb.innerHTML = "";
            data.forEach(i => { tb.innerHTML += `<tr><td>${new Date(i.date_saisie).toLocaleDateString()}</td><td>${i.ligne_production}</td><td>${i.machine_num}</td><td><button onclick="delInter(${i.id})">DEL</button></td></tr>`; });
        }

        async function delInter(id) { if(confirm("Supprimer ?")) { await fetch(`/api/admin/delete_inter/${id}`, {method:'DELETE'}); loadInter(); } }

        window.onload = () => { loadLignes(); loadUsers(); loadInter(); };
    </script>
</body>
</html>
