<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GMAO - Administration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .admin-nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #2d353f; padding-bottom: 10px; }
        .nav-tab { padding: 10px 20px; background: #1a1f26; border: 1px solid #2d353f; color: white; cursor: pointer; border-radius: 8px; }
        .nav-tab.active { background: #38bdf8; color: black; font-weight: bold; }
        
        .tab-content { display: none; background: #1a1f26; padding: 20px; border-radius: 12px; border: 1px solid #2d353f; }
        .tab-content.active { display: block; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; color: #38bdf8; padding: 12px; border-bottom: 2px solid #2d353f; font-size: 0.8rem; }
        td { padding: 12px; border-bottom: 1px solid #2d353f; }
        
        .btn-del { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .btn-add { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
        
        #debug-console { 
            background: #000; color: #00ff00; font-family: monospace; font-size: 11px; 
            padding: 10px; height: 100px; overflow-y: auto; border: 1px solid #333; margin-top: 20px; 
        }
    </style>
</head>
<body>
    <div class="main-container" style="max-width: 1200px;">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>Administration GMAO</h1>
            <button onclick="window.location.href='/'" class="btn-secondary">Quitter</button>
        </header>

        <div class="admin-nav">
            <div class="nav-tab active" onclick="openTab(event, 'equipe')">👥 Équipe</div>
            <div class="nav-tab" onclick="openTab(event, 'lignes')">🏭 Lignes</div>
            <div class="nav-tab" onclick="openTab(event, 'interventions')">📋 Interventions</div>
        </div>

        <div id="equipe" class="tab-content active">
            <h3>Ajouter un profil</h3>
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <input type="text" id="u-nom" placeholder="Nom Complet">
                <input type="text" id="u-pin" placeholder="Code PIN">
                <select id="u-role">
                    <option value="referent">Référent</option>
                    <option value="technicien">Technicien</option>
                </select>
                <button class="btn-add" onclick="addUser()">Ajouter</button>
            </div>
            <table>
                <thead><tr><th>Nom</th><th>Rôle</th><th>Code</th><th>Action</th></tr></thead>
                <tbody id="table-users"></tbody>
            </table>
        </div>

        <div id="lignes" class="tab-content">
            <h3>Configuration des lignes</h3>
            <div style="display:flex; gap:10px;">
                <input type="text" id="l-nom" placeholder="Nom de la ligne">
                <button class="btn-add" onclick="addLigne()">Ajouter</button>
            </div>
            <ul id="list-lignes" style="margin-top:20px; list-style: none; padding: 0;"></ul>
        </div>

        <div id="interventions" class="tab-content">
            <div style="display:flex; justify-content: space-between;">
                <h3>Historique</h3>
                <button onclick="window.location.href='/api/export_csv'" style="background:#f59e0b; color:white; border:none; padding:8px; border-radius:5px; cursor:pointer;">📥 Export Excel</button>
            </div>
            <table>
                <thead>
                    <tr><th>Date</th><th>Ligne</th><th>Machine</th><th>Détails</th><th>Action</th></tr>
                </thead>
                <tbody id="table-inter"></tbody>
            </table>
        </div>

        <div id="debug-console">>> Système prêt.</div>
    </div>

    <script>
        function log(msg, err=false) {
            const c = document.getElementById('debug-console');
            c.innerHTML += `<div style="color:${err?'red':'#0f0'}">>> ${msg}</div>`;
            c.scrollTop = c.scrollHeight;
        }

        function openTab(evt, tabName) {
            let contents = document.getElementsByClassName("tab-content");
            for (let c of contents) c.classList.remove("active");
            let tabs = document.getElementsByClassName("nav-tab");
            for (let t of tabs) t.classList.remove("active");
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        // --- GESTION DES UTILISATEURS ---
        async function loadUsers() {
            const res = await fetch('/api/admin/users');
            const data = await res.json();
            const tb = document.getElementById('table-users');
            tb.innerHTML = "";
            data.forEach(u => {
                tb.innerHTML += `<tr><td>${u.nom_complet}</td><td>${u.role}</td><td>${u.password_hash}</td><td><button class="btn-del" onclick="deleteUser(${u.id})">Supprimer</button></td></tr>`;
            });
            log(data.length + " profils chargés.");
        }

        async function addUser() {
            const data = { nom: document.getElementById('u-nom').value, username: document.getElementById('u-nom').value, password: document.getElementById('u-pin').value, role: document.getElementById('u-role').value };
            const res = await fetch('/api/admin/users', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            if(res.ok) { 
                log("Utilisateur ajouté !"); 
                document.getElementById('u-nom').value = ""; 
                document.getElementById('u-pin').value = "";
                loadUsers(); 
            } else { log("Erreur ajout", true); }
        }

        async function deleteUser(id) {
            if(confirm("Supprimer ?")) {
                await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
                loadUsers();
            }
        }

        // --- GESTION DES LIGNES ---
        async function loadLignes() {
            const res = await fetch('/api/lignes');
            const data = await res.json();
            const list = document.getElementById('list-lignes');
            list.innerHTML = "";
            data.forEach(l => {
                list.innerHTML += `<li style="padding:10px; border-bottom:1px solid #333; display:flex; justify-content:space-between;">${l.nom_ligne} <button class="btn-del" onclick="deleteLigne(${l.id})">X</button></li>`;
            });
        }

        async function addLigne() {
            const nom = document.getElementById('l-nom').value;
            await fetch('/api/lignes', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({nom}) });
            document.getElementById('l-nom').value = "";
            loadLignes();
        }

        async function deleteLigne(id) {
            await fetch(`/api/lignes/${id}`, { method: 'DELETE' });
            loadLignes();
        }

        // --- CHARGEMENT INITIAL ---
        window.onload = () => {
            loadUsers();
            loadLignes();
            // Charger les interventions
            fetch('/api/historique_complet').then(r => r.json()).then(data => {
                const tb = document.getElementById('table-inter');
                tb.innerHTML = "";
                data.forEach(i => {
                    tb.innerHTML += `<tr><td>${new Date(i.date_saisie).toLocaleDateString()}</td><td>${i.ligne_production}</td><td>${i.machine_num}</td><td>${i.description}</td><td><button class="btn-del" onclick="deleteInter(${i.id})">DEL</button></td></tr>`;
                });
            });
        };

        async function deleteInter(id) {
            if(confirm("Supprimer l'intervention ?")) {
                await fetch(`/api/admin/delete_inter/${id}`, { method: 'DELETE' });
                location.reload();
            }
        }
    </script>
</body>
</html>
