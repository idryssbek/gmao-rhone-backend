<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="stats-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; padding: 20px;">
    
    <div class="chart-card" style="background: #1e293b; padding: 20px; border-radius: 15px; border: 1px solid #334155;">
        <h3 style="color: #38bdf8; font-size: 0.9rem; text-transform: uppercase;">Interventions par Ligne</h3>
        <canvas id="chartLignesInter"></canvas>
        <div id="resume-lignes-inter" class="resume-box" style="margin-top:15px; font-size:0.85rem; color:#94a3b8;"></div>
    </div>

    <div class="chart-card" style="background: #1e293b; padding: 20px; border-radius: 15px; border: 1px solid #334155;">
        <h3 style="color: #38bdf8; font-size: 0.9rem; text-transform: uppercase;">Temps total par Ligne (min)</h3>
        <canvas id="chartLignesTemps"></canvas>
        <div id="resume-lignes-temps" class="resume-box" style="margin-top:15px; font-size:0.85rem; color:#94a3b8;"></div>
    </div>

    <div class="chart-card" style="background: #1e293b; padding: 20px; border-radius: 15px; border: 1px solid #334155;">
        <h3 style="color: #38bdf8; font-size: 0.9rem; text-transform: uppercase;">Alertes par Référent</h3>
        <canvas id="chartRefInter"></canvas>
        <div id="resume-ref-inter" class="resume-box" style="margin-top:15px; font-size:0.85rem; color:#94a3b8;"></div>
    </div>

    <div class="chart-card" style="background: #1e293b; padding: 20px; border-radius: 15px; border: 1px solid #334155;">
        <h3 style="color: #38bdf8; font-size: 0.9rem; text-transform: uppercase;">Temps déclaré par Référent (min)</h3>
        <canvas id="chartRefTemps"></canvas>
        <div id="resume-ref-temps" class="resume-box" style="margin-top:15px; font-size:0.85rem; color:#94a3b8;"></div>
    </div>
</div>

<script>
async function chargerStats() {
    try {
        const res = await fetch('/api/historique_complet');
        const data = await res.json();

        // On filtre pour ne garder que ce qui vient des référents
        const cleanData = data.filter(i => i.nom_referent && i.nom_referent.trim() !== "");

        if (cleanData.length === 0) {
            console.warn("Aucune donnée de référent trouvée pour les stats.");
            return;
        }

        const statsLignes = {};
        const statsRefs = {};

        cleanData.forEach(i => {
            // Extraction du temps : cherche un nombre après "Durée:" ou met 15 par défaut
            let temps = 15; 
            const match = i.description ? i.description.match(/(\d+)\s*min/) : null;
            if(match) temps = parseInt(match[1]);

            // Groupement par Ligne
            if(!statsLignes[i.ligne_production]) statsLignes[i.ligne_production] = { count: 0, time: 0 };
            statsLignes[i.ligne_production].count++;
            statsLignes[i.ligne_production].time += temps;

            // Groupement par Référent
            const ref = i.nom_referent;
            if(!statsRefs[ref]) statsRefs[ref] = { count: 0, time: 0 };
            statsRefs[ref].count++;
            statsRefs[ref].time += temps;
        });

        // Génération des 4 graphiques
        genererCamembert('chartLignesInter', statsLignes, 'count', 'Interventions');
        genererCamembert('chartLignesTemps', statsLignes, 'time', 'Minutes');
        genererCamembert('chartRefInter', statsRefs, 'count', 'Interventions');
        genererCamembert('chartRefTemps', statsRefs, 'time', 'Minutes');

        // Mise à jour des textes de résumé
        majResumes(statsLignes, statsRefs);

    } catch (error) {
        console.error("Erreur stats:", error);
    }
}

function genererCamembert(canvasId, dataset, key, labelGlobal) {
    const ctx = document.getElementById(canvasId).getContext('2d');
    
    // On détruit l'ancien graphique s'il existe pour éviter les bugs de survol
    const chartExist = Chart.getChart(canvasId);
    if (chartExist) chartExist.destroy();

    new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: Object.keys(dataset),
            datasets: [{
                data: Object.values(dataset).map(v => v[key]),
                backgroundColor: ['#38bdf8', '#10b981', '#f59e0b', '#ef4444', '#a855f7', '#6366f1'],
                hoverOffset: 10,
                borderWidth: 2,
                borderColor: '#1e293b'
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'bottom', labels: { color: '#f1f5f9', font: { size: 11 } } }
            }
        }
    });
}

function majResumes(lignes, refs) {
    const topLigne = Object.entries(lignes).reduce((a, b) => a[1].count > b[1].count ? a : b);
    document.getElementById('resume-lignes-inter').innerHTML = `Ligne la plus active : <b style="color:#38bdf8">${topLigne[0]}</b> (${topLigne[1].count} inters)`;
    
    const topRef = Object.entries(refs).reduce((a, b) => a[1].count > b[1].count ? a : b);
    document.getElementById('resume-ref-inter').innerHTML = `Top émetteur : <b style="color:#10b981">${topRef[0]}</b> (${topRef[1].count} alertes)`;
}

// Lancement au chargement
window.onload = chargerStats;
</script>
