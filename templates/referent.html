<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMAO - Référent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="main-container">
        <h2>NOUVELLE INTERVENTION</h2>
        <p id="user-display" style="color:#8b949e;"></p>

        <div class="form-group">
            <label>1. Ligne de Production</label>
            <select id="ligne"><option value="">-- Chargement... --</option></select>
        </div>

        <div class="form-group">
            <label>2. N° Machine</label>
            <input type="text" id="machine" placeholder="Saisie manuelle">
        </div>

        <div class="form-group">
            <label>3. Problème / Action</label>
            <textarea id="desc" style="height:100px; width:100%;" placeholder="Décrivez le problème..."></textarea>
        </div>

        <button class="btn-send" onclick="envoyer()" style="width:100%; padding:20px; background:#10b981; color:white; border-radius:10px; font-weight:bold;">VALIDER</button>
        <button onclick="window.location.href='/'" style="width:100%; margin-top:10px; background:none; border:none; color:#666;">Retour</button>
    </div>

    <script>
        document.getElementById('user-display').innerText = "Connecté : " + localStorage.getItem('user_nom');

        async function chargerLignes() {
            const res = await fetch('/api/lignes');
            const data = await res.json();
            const sel = document.getElementById('ligne');
            sel.innerHTML = '<option value="">-- Sélectionner --</option>';
            data.forEach(l => { sel.add(new Option(l.nom_ligne, l.nom_ligne)); });
        }

        async function envoyer() {
            const data = {
                ligne: document.getElementById('ligne').value,
                machine: document.getElementById('machine').value,
                nom_op: localStorage.getItem('user_nom'),
                description: document.getElementById('desc').value,
                id_referent: localStorage.getItem('user_id')
            };
            if(!data.ligne || !data.machine) return alert("Remplissez la ligne et la machine.");

            const res = await fetch('/api/save_intervention', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if(res.ok) { alert("Enregistré !"); window.location.href = '/'; }
        }
        chargerLignes();
    </script>
</body>
</html>
