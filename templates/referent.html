<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMAO - Référent</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f1f5f9;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Barre d'onglets */
        .tabs {
            display: flex;
            justify-content: center;
            background: var(--card-bg);
            border-bottom: 2px solid #334155;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .tab-btn {
            padding: 20px 40px;
            border: none;
            background: none;
            color: #64748b;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            border-bottom: 4px solid transparent;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .container {
            width: 95%;
            max-width: 1000px;
            margin: 20px auto;
            background: var(--card-bg);
            padding: 25px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .container.active { display: block; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            margin-bottom: 25px;
            padding-bottom: 10px;
        }

        h2 { color: var(--accent); margin: 0; text-transform: uppercase; font-size: 1.4rem; }
        .user-tag { background: #334155; padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .form-group { margin-bottom: 15px; }

        label {
            display: block; margin-bottom: 8px; font-weight: 600;
            color: var(--accent); font-size: 0.85rem; text-transform: uppercase;
        }

        input, select, textarea {
            width: 100%; padding: 16px; background: #0f172a;
            border: 2px solid #334155; border-radius: 12px;
            color: white; font-size: 1.1rem; box-sizing: border-box;
        }

        textarea { height: 110px; resize: none; }

        .footer-actions {
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 20px;
            align-items: center;
        }

        .btn-send {
            background: var(--success); color: white; border: none;
            padding: 22px; border-radius: 16px; font-size: 1.3rem;
            font-weight: bold; cursor: pointer; transition: transform 0.1s;
        }
        .btn-send:active { transform: scale(0.98); }

        /* Style Historique */
        .history-list { display: flex; flex-direction: column; gap: 15px; }
        .history-item {
            background: #0f172a; padding: 20px; border-radius: 15px;
            border-left: 6px solid #475569;
            transition: all 0.3s ease;
        }
        .status-en_attente { border-left-color: var(--warning); background: rgba(245, 158, 11, 0.05); }
        .status-saisi_gmao { border-left-color: var(--success); background: rgba(16, 185, 129, 0.05); }
        
        .history-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .history-date { font-size: 0.8rem; color: #64748b; }
        .history-title { font-weight: bold; font-size: 1.1rem; color: var(--accent); }
        .badge-status { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        .badge-attente { background: var(--warning); color: black; }
        .badge-ok { background: var(--success); color: white; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 800px) {
            .form-grid { grid-template-columns: 1fr; }
            .footer-actions { grid-template-columns: 1fr; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="tabs">
        <button id="btn-tab-saisie" class="tab-btn active" onclick="switchTab('saisie')">Nouvelle Saisie</button>
        <button id="btn-tab-histo" class="tab-btn" onclick="switchTab('historique')">Mon Historique <span id="count-attente" style="color:var(--warning)"></span></button>
    </div>

    <div id="tab-saisie" class="container active">
        <header>
            <h2>Demande d'Intervention</h2>
            <div class="user-tag" id="user-display">Référent : -</div>
        </header>

        <div class="form-grid">
            <div class="col">
                <div class="form-group">
                    <label>🏭 Ligne de Production</label>
                    <select id="ligne"><option value="">-- Choisir --</option></select>
                </div>
                <div class="form-group">
                    <label>🔢 Numéro de Machine</label>
                    <input type="text" id="machine" placeholder="Ex: M-05">
                </div>
                <div class="form-group">
                    <label>⏱️ Temps estimé / passé</label>
                    <select id="temps"></select>
                </div>
            </div>

            <div class="col">
                <div class="form-group">
                    <label>❓ Problème constaté</label>
                    <textarea id="probleme" placeholder="Décrivez le défaut..."></textarea>
                </div>
                <div class="form-group">
                    <label>🛠️ Action réalisée (si applicable)</label>
                    <textarea id="action" placeholder="Qu'avez-vous tenté ?"></textarea>
                </div>
            </div>
        </div>

        <div class="footer-actions">
            <a href="/login?role=referent" style="color:#64748b; text-decoration:none; font-weight:bold;">🚪 QUITTER</a>
            <button class="btn-send" onclick="envoyerMaintenance()">ENVOYER À LA MAINTENANCE</button>
        </div>
    </div>

    <div id="tab-historique" class="container">
        <header>
            <h2>Suivi de mes demandes</h2>
            <div style="font-size: 0.8rem; color: var(--success);">● LIVE : Mis à jour auto</div>
        </header>
        <div id="history-container" class="history-list">
            </div>
    </div>

    <script>
        const myName = localStorage.getItem('user_nom');
        const myId = localStorage.getItem('user_id');
        let memoireHistorique = ""; // Pour éviter de rafraîchir le DOM inutilement

        document.getElementById('user-display').innerText = "Référent : " + (myName || "Utilisateur");

        function switchTab(tab) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            if(tab === 'saisie') {
                document.getElementById('tab-saisie').classList.add('active');
                document.getElementById('btn-tab-saisie').classList.add('active');
            } else {
                document.getElementById('tab-historique').classList.add('active');
                document.getElementById('btn-tab-histo').classList.add('active');
                chargerMonHistorique();
            }
        }

        // --- Remplissage des champs ---
        async function chargerLignes() {
            const res = await fetch('/api/lignes');
            const lignes = await res.json();
            const sel = document.getElementById('ligne');
            lignes.forEach(l => sel.add(new Option(l.nom_ligne, l.nom_ligne)));
        }

        const selectTemps = document.getElementById('temps');
        for (let i = 5; i <= 120; i += 5) {
            let label = i >= 60 ? `${Math.floor(i/60)}h${(i%60||'00')}` : `${i} min`;
            selectTemps.add(new Option(label, label));
        }

        // --- Envoi ---
        async function envoyerMaintenance() {
            const prob = document.getElementById('probleme').value;
            const act = document.getElementById('action').value;
            const dur = document.getElementById('temps').value;

            const payload = {
                ligne: document.getElementById('ligne').value,
                machine: document.getElementById('machine').value,
                nom_op: myName,
                description: `PROBLÈME: ${prob} | ACTION: ${act} | DURÉE: ${dur}`,
                id_referent: myId
            };

            if(!payload.ligne || !payload.machine || !prob) { 
                alert("Veuillez remplir au moins la Ligne, la Machine et le Problème."); 
                return; 
            }

            const res = await fetch('/api/save_intervention', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if(res.ok) {
                alert("✅ Demande envoyée avec succès !");
                location.reload();
            }
        }

        // --- Historique Live ---
        async function chargerMonHistorique() {
            try {
                const res = await fetch('/api/historique_complet');
                const data = await res.json();
                
                const mesInters = data.filter(i => String(i.id_referent) === String(myId));
                
                // On génère le HTML pour comparer
                const nouveauHtml = mesInters.length === 0 ? 
                    "<p style='text-align:center; color:#64748b;'>Aucune demande envoyée.</p>" :
                    mesInters.map(i => {
                        const date = new Date(i.date_saisie).toLocaleString('fr-FR', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
                        const isAttente = i.statut === 'en_attente';
                        return `
                            <div class="history-item status-${i.statut}">
                                <div class="history-header">
                                    <span class="history-date">${date}</span>
                                    <span class="badge-status ${isAttente ? 'badge-attente' : 'badge-ok'}">
                                        ${isAttente ? '⏳ EN ATTENTE' : '✅ SAISI GMAO'}
                                    </span>
                                </div>
                                <div class="history-title">${i.ligne_production} - Machine ${i.machine_num}</div>
                                <div style="font-size:0.9rem; margin-top:8px; color:#cbd5e1;">${i.description}</div>
                            </div>
                        `;
                    }).join('');

                if (memoireHistorique !== nouveauHtml) {
                    document.getElementById('history-container').innerHTML = nouveauHtml;
                    memoireHistorique = nouveauHtml;
                }

                // Petit compteur de notif pour l'onglet
                const attenteCount = mesInters.filter(i => i.statut === 'en_attente').length;
                document.getElementById('count-attente').innerText = attenteCount > 0 ? `(${attenteCount})` : "";

            } catch (e) { console.error("Erreur sync historique"); }
        }

        // Init
        chargerLignes();
        // Rafraîchissement automatique toutes les 2.5 secondes
        setInterval(chargerMonHistorique, 2500);

    </script>
</body>
</html>
