<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMAO - Saisie Référent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f1f5f9;
            --success: #10b981;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 95%;
            max-width: 1000px; /* Plus large pour le mode paysage */
            background: var(--card-bg);
            padding: 25px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            margin-bottom: 25px;
            padding-bottom: 10px;
        }

        h2 { color: var(--accent); margin: 0; text-transform: uppercase; font-size: 1.4rem; }
        .user-tag { background: #334155; padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; }

        /* Grille en deux colonnes pour tablette paysage */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .form-group { margin-bottom: 15px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--accent);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        input, select, textarea {
            width: 100%;
            padding: 16px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            box-sizing: border-box;
        }

        textarea { height: 110px; resize: none; }

        .full-width { grid-column: span 2; }

        .footer-actions {
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr 3fr; /* Bouton retour plus petit que valider */
            gap: 20px;
            align-items: center;
        }

        .btn-send {
            background: var(--success);
            color: white;
            border: none;
            padding: 22px;
            border-radius: 16px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.2);
        }

        .btn-send:active { transform: scale(0.98); background: #059669; }

        .btn-back {
            text-align: center;
            color: #64748b;
            text-decoration: none;
            font-weight: 500;
        }

        /* Ajustement si jamais la tablette est remise à la verticale */
        @media (max-width: 800px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .footer-actions { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h2>Nouvelle Intervention</h2>
            <div class="user-tag" id="user-display">Référent : -</div>
        </header>

        <div class="form-grid">
            <div class="col">
                <div class="form-group">
                    <label>1. Ligne de Production</label>
                    <select id="ligne">
                        <option value="">-- Sélectionner --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>2. Numéro de Machine</label>
                    <input type="text" id="machine" placeholder="Ex: M-05">
                </div>
                <div class="form-group">
                    <label>5. Temps passé</label>
                    <select id="temps"></select>
                </div>
            </div>

            <div class="col">
                <div class="form-group">
                    <label>3. Problème constaté</label>
                    <textarea id="probleme" placeholder="Description du défaut..."></textarea>
                </div>
                <div class="form-group">
                    <label>4. Action réalisée</label>
                    <textarea id="action" placeholder="Dépannage effectué..."></textarea>
                </div>
            </div>
        </div>

        <div class="footer-actions">
            <a href="/" class="btn-back">ANNULER</a>
            <button class="btn-send" onclick="envoyerMaintenance()">ENVOYER À LA MAINTENANCE</button>
        </div>
    </div>

    <script>
        document.getElementById('user-display').innerText = "Référent : " + (localStorage.getItem('user_nom') || "Utilisateur");

        async function chargerLignes() {
            try {
                const res = await fetch('/api/lignes');
                const lignes = await res.json();
                const sel = document.getElementById('ligne');
                lignes.forEach(l => {
                    sel.add(new Option(l.nom_ligne, l.nom_ligne));
                });
            } catch (e) { console.error("Erreur lignes:", e); }
        }

        const selectTemps = document.getElementById('temps');
        for (let i = 5; i <= 180; i += 5) {
            let h = Math.floor(i / 60);
            let m = i % 60;
            let label = h > 0 ? `${h}h${m > 0 ? (m < 10 ? '0'+m : m) : '00'}` : `${m} min`;
            selectTemps.add(new Option(label, label));
        }

        async function envoyerMaintenance() {
            const data = {
                ligne: document.getElementById('ligne').value,
                machine: document.getElementById('machine').value,
                prob: document.getElementById('probleme').value,
                act: document.getElementById('action').value,
                temps: document.getElementById('temps').value,
                nom_op: localStorage.getItem('user_nom'),
                id_referent: localStorage.getItem('user_id')
            };

            if(!data.ligne || !data.machine || !data.prob) {
                alert("Erreur : Ligne, Machine et Problème sont obligatoires.");
                return;
            }

            const payload = {
                ligne: data.ligne,
                machine: data.machine,
                nom_op: data.nom_op,
                description: `PB: ${data.prob} | ACT: ${data.act} | DURÉE: ${data.temps}`,
                id_referent: data.id_referent
            };

            const res = await fetch('/api/save_intervention', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if(res.ok) {
                alert("✅ Transmis avec succès !");
                window.location.href = '/';
            }
        }

        chargerLignes();
    </script>
</body>
</html>
