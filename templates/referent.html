<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMAO - Référent</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f1f5f9;
            --success: #10b981;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Barre d'onglets */
        .tabs {
            display: flex;
            justify-content: center;
            background: var(--card-bg);
            border-bottom: 2px solid #334155;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .tab-btn {
            padding: 20px 40px;
            border: none;
            background: none;
            color: #64748b;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            border-bottom: 4px solid transparent;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .container {
            width: 95%;
            max-width: 1000px;
            margin: 20px auto;
            background: var(--card-bg);
            padding: 25px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            display: none; /* Masqué par défaut */
        }

        .container.active { display: block; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            margin-bottom: 25px;
            padding-bottom: 10px;
        }

        h2 { color: var(--accent); margin: 0; text-transform: uppercase; font-size: 1.4rem; }
        .user-tag { background: #334155; padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .form-group { margin-bottom: 15px; }

        label {
            display: block; margin-bottom: 8px; font-weight: 600;
            color: var(--accent); font-size: 0.85rem; text-transform: uppercase;
        }

        input, select, textarea {
            width: 100%; padding: 16px; background: #0f172a;
            border: 2px solid #334155; border-radius: 12px;
            color: white; font-size: 1.1rem; box-sizing: border-box;
        }

        textarea { height: 110px; resize: none; }

        .footer-actions {
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 20px;
        }

        .btn-send {
            background: var(--success); color: white; border: none;
            padding: 22px; border-radius: 16px; font-size: 1.3rem;
            font-weight: bold; cursor: pointer;
        }

        /* Style Historique */
        .history-list { display: flex; flex-direction: column; gap: 15px; }
        .history-item {
            background: #0f172a; padding: 20px; border-radius: 15px;
            border-left: 5px solid #475569;
        }
        .status-en_attente { border-left-color: #f59e0b; }
        .status-saisi_gmao { border-left-color: var(--success); }
        
        .history-date { font-size: 0.8rem; color: #64748b; margin-bottom: 5px; }
        .history-title { font-weight: bold; font-size: 1.1rem; color: var(--accent); }

        @media (max-width: 800px) {
            .form-grid { grid-template-columns: 1fr; }
            .footer-actions { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('saisie')">Nouvelle Saisie</button>
        <button class="tab-btn" onclick="switchTab('historique')">Mon Historique</button>
    </div>

    <div id="tab-saisie" class="container active">
        <header>
            <h2>Nouvelle Intervention</h2>
            <div class="user-tag" id="user-display">Référent : -</div>
        </header>

        <div class="form-grid">
            <div class="col">
                <div class="form-group">
                    <label>1. Ligne de Production</label>
                    <select id="ligne"><option value="">-- Sélectionner --</option></select>
                </div>
                <div class="form-group">
                    <label>2. Numéro de Machine</label>
                    <input type="text" id="machine" placeholder="Ex: M-05">
                </div>
                <div class="form-group">
                    <label>3. Temps passé</label>
                    <select id="temps"></select>
                </div>
            </div>

            <div class="col">
                <div class="form-group">
                    <label>4. Problème constaté</label>
                    <textarea id="probleme" placeholder="Défaut..."></textarea>
                </div>
                <div class="form-group">
                    <label>5. Action réalisée</label>
                    <textarea id="action" placeholder="Dépannage..."></textarea>
                </div>
            </div>
        </div>

        <div class="footer-actions">
            <a href="/" style="text-align:center; color:#64748b; text-decoration:none;">ANNULER</a>
            <button class="btn-send" onclick="envoyerMaintenance()">ENVOYER MAINTENANCE</button>
        </div>
    </div>

    <div id="tab-historique" class="container">
        <header>
            <h2>Mes dernières saisies</h2>
        </header>
        <div id="history-container" class="history-list">
            </div>
    </div>

    <script>
        const myName = localStorage.getItem('user_nom');
        const myId = localStorage.getItem('user_id');
        document.getElementById('user-display').innerText = "Référent : " + (myName || "Utilisateur");

        function switchTab(tab) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            if(tab === 'saisie') {
                document.getElementById('tab-saisie').classList.add('active');
                event.currentTarget.classList.add('active');
            } else {
                document.getElementById('tab-historique').classList.add('active');
                event.currentTarget.classList.add('active');
                chargerMonHistorique();
            }
        }

        // --- Logique Formulaire ---
        async function chargerLignes() {
            const res = await fetch('/api/lignes');
            const lignes = await res.json();
            const sel = document.getElementById('ligne');
            lignes.forEach(l => sel.add(new Option(l.nom_ligne, l.nom_ligne)));
        }

        const selectTemps = document.getElementById('temps');
        for (let i = 5; i <= 180; i += 5) {
            let h = Math.floor(i / 60);
            let m = i % 60;
            let label = h > 0 ? `${h}h${m > 0 ? (m < 10 ? '0'+m : m) : '00'}` : `${m} min`;
            selectTemps.add(new Option(label, label));
        }

        async function envoyerMaintenance() {
            const payload = {
                ligne: document.getElementById('ligne').value,
                machine: document.getElementById('machine').value,
                nom_op: myName,
                description: `PB: ${document.getElementById('probleme').value} | ACT: ${document.getElementById('action').value} | DURÉE: ${document.getElementById('temps').value}`,
                id_referent: myId
            };

            if(!payload.ligne || !payload.machine) { alert("Ligne et Machine obligatoires"); return; }

            const res = await fetch('/api/save_intervention', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if(res.ok) {
                alert("✅ Transmis !");
                location.reload();
            }
        }

        // --- Logique Historique ---
        async function chargerMonHistorique() {
            const container = document.getElementById('history-container');
            container.innerHTML = "Chargement...";
            
            const res = await fetch('/api/historique_complet');
            const data = await res.json();
            
            // On ne garde que les interventions de ce référent
            const mesInters = data.filter(i => String(i.id_referent) === String(myId));

            container.innerHTML = mesInters.length === 0 ? "Aucune intervention trouvée." : "";

            mesInters.forEach(i => {
                const date = new Date(i.date_saisie).toLocaleString('fr-FR', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
                const div = document.createElement('div');
                div.className = `history-item status-${i.statut}`;
                div.innerHTML = `
                    <div class="history-date">${date} - <b style="color:${i.statut === 'en_attente' ? '#f59e0b' : '#10b981'}">${i.statut.toUpperCase()}</b></div>
                    <div class="history-title">${i.ligne_production} - Machine ${i.machine_num}</div>
                    <div style="font-size:0.9rem; margin-top:5px;">${i.description}</div>
                `;
                container.appendChild(div);
            });
        }

        chargerLignes();
    </script>
</body>
</html>
