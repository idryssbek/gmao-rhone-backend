<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMAO - Saisie Référent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #38bdf8; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; }
        input, select, textarea { 
            width: 100%; padding: 15px; background: #1a1f26; border: 2px solid #2d353f; 
            border-radius: 10px; color: white; font-size: 1rem; box-sizing: border-box;
        }
        textarea { height: 80px; resize: none; }
        .btn-send { 
            background: #10b981; color: white; border: none; width: 100%; padding: 20px; 
            border-radius: 12px; font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-top: 10px; 
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h2 style="color: #38bdf8; margin-top: 0;">Nouvelle Intervention</h2>
        <p id="user-display" style="color: #666; margin-bottom: 25px;">Connecté : -</p>

        <div class="form-group">
            <label>1. Ligne de Production</label>
            <select id="ligne">
                <option value="">-- Sélectionner la ligne --</option>
                <option value="Ligne A">Ligne A</option>
                <option value="Ligne B">Ligne B</option>
                <option value="Ligne C">Ligne C</option>
                <option value="Ligne D">Ligne D</option>
            </select>
        </div>

        <div class="form-group">
            <label>2. N° Machine (Saisie manuelle)</label>
            <input type="text" id="machine" placeholder="Ex: M05, Presse 2...">
        </div>

        <div class="form-group">
            <label>3. Problème constaté</label>
            <textarea id="probleme" placeholder="Décrivez le défaut..."></textarea>
        </div>

        <div class="form-group">
            <label>4. Action réalisée</label>
            <textarea id="action" placeholder="Qu'avez-vous fait ?"></textarea>
        </div>

        <div class="form-group">
            <label>5. Temps passé</label>
            <select id="temps"></select>
        </div>

        <button class="btn-send" onclick="envoyerIntervention()">VALIDER L'INTERVENTION</button>
        <button onclick="window.location.href='/'" style="background:none; border:none; color:#666; width:100%; margin-top:15px; cursor:pointer;">Annuler et retour</button>
    </div>

    <script>
        document.getElementById('user-display').innerText = "Référent : " + localStorage.getItem('user_nom');

        // Générer le menu déroulant du temps (5min à 180min)
        const selectTemps = document.getElementById('temps');
        for (let i = 5; i <= 180; i += 5) {
            let h = Math.floor(i / 60);
            let m = i % 60;
            let label = h > 0 ? `${h}h${m > 0 ? m : '00'}` : `${m} min`;
            let option = new Option(label, label);
            selectTemps.add(option);
        }

        async function envoyerIntervention() {
            const ligne = document.getElementById('ligne').value;
            const machine = document.getElementById('machine').value;
            const prob = document.getElementById('probleme').value;
            const act = document.getElementById('action').value;
            const temps = document.getElementById('temps').value;

            if(!ligne || !machine || !prob) {
                alert("Merci de remplir au moins la ligne, la machine et le problème.");
                return;
            }

            const data = {
                ligne: ligne,
                machine: machine,
                nom_op: localStorage.getItem('user_nom'),
                description: `PROBLÈME: ${prob} | ACTION: ${act} | TEMPS: ${temps}`,
                id_referent: localStorage.getItem('user_id')
            };

            const res = await fetch('/api/save_intervention', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if(res.ok) {
                alert("Intervention enregistrée !");
                window.location.href = '/';
            }
        }
    </script>
</body>
</html>
