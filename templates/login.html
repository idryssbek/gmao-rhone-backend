<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMAO - Connexion</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --accent: #38bdf8;
            --text: #c9d1d9;
            --tech-color: #38bdf8;
            --ref-color: #f59e0b;
        }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
            color: white;
            text-transform: uppercase;
        }

        .role-selection {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        /* Remplacement des emojis par des boutons stylisés */
        .role-btn {
            background: transparent;
            border: 1px solid var(--border);
            padding: 15px 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .role-btn span {
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            color: #8b949e;
        }

        /* Style Technicien */
        .role-btn.tech:hover, .role-btn.tech.active {
            border-color: var(--tech-color);
            background: rgba(56, 189, 248, 0.05);
        }
        .role-btn.tech.active span { color: var(--tech-color); }

        /* Style Référent */
        .role-btn.ref:hover, .role-btn.ref.active {
            border-color: var(--ref-color);
            background: rgba(245, 158, 11, 0.05);
        }
        .role-btn.ref.active span { color: var(--ref-color); }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 8px;
            color: #8b949e;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            color: #0d1117;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn-login:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        #error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="card">
            <h1>Accès GMAO</h1>
            
            <div class="role-selection">
                <div id="btn-tech" class="role-btn tech active" onclick="setRole('technicien')">
                    <span>TECHNICIEN</span>
                </div>
                <div id="btn-ref" class="role-btn ref" onclick="setRole('referent')">
                    <span>RÉFÉRENT</span>
                </div>
            </div>

            <div class="input-group">
                <label>VOTRE CODE PIN</label>
                <input type="password" id="pin" placeholder="••••" maxlength="4" inputmode="numeric">
            </div>

            <button class="btn-login" onclick="login()">Se connecter</button>
            <div id="error-msg">Code PIN incorrect</div>
        </div>
    </div>

    <script>
        let selectedRole = 'technicien';

        function setRole(role) {
            selectedRole = role;
            document.getElementById('btn-tech').classList.remove('active');
            document.getElementById('btn-ref').classList.remove('active');
            
            if(role === 'technicien') {
                document.getElementById('btn-tech').classList.add('active');
            } else {
                document.getElementById('btn-ref').classList.add('active');
            }
        }

        async function login() {
            const pin = document.getElementById('pin').value;
            if(!pin) return;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ pin, role: selectedRole })
            });

            if(res.ok) {
                window.location.href = '/';
            } else {
                const err = document.getElementById('error-msg');
                err.style.display = 'block';
                setTimeout(() => err.style.display = 'none', 3000);
            }
        }

        // Connexion avec la touche Entrée
        document.getElementById('pin').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
