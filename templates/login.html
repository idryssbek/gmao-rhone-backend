<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMAO - Identification</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f1f5f9;
        }

        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Inter', system-ui, sans-serif; 
            margin: 0; display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; padding: 20px;
        }

        .login-container { width: 100%; max-width: 1000px; text-align: center; }

        h2 { font-weight: 600; text-transform: uppercase; color: var(--accent); margin-bottom: 40px; font-size: 1.5rem; }

        /* Grille Pro avec Prénoms */
        .user-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 20px; 
        }

        .user-card { 
            background: var(--card-bg); 
            border: 2px solid #334155; 
            padding: 35px 20px; 
            border-radius: 16px; 
            cursor: pointer; 
            transition: all 0.2s ease;
            display: flex; justify-content: center; align-items: center;
        }

        .user-card:hover { 
            border-color: var(--accent); 
            background: #243146; 
            transform: scale(1.03);
        }

        .user-card:active { transform: scale(0.95); }

        .user-name { font-weight: 600; font-size: 1.3rem; text-align: center; }

        /* Pavé Numérique */
        #auth-section { 
            background: var(--card-bg); padding: 40px; border-radius: 24px; 
            width: 350px; margin: 0 auto; display: none;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .pin-view { 
            font-size: 2.5rem; letter-spacing: 15px; margin-bottom: 30px; 
            color: var(--accent); min-height: 50px;
        }

        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .num-btn { 
            background: #0f172a; color: white; border: 1px solid #334155; 
            padding: 20px; border-radius: 12px; font-size: 1.5rem; cursor: pointer; font-weight: bold;
        }
        .num-btn:active { background: var(--accent); color: var(--bg); }

        .btn-cancel { margin-top:25px; background:none; border:none; color:#64748b; cursor:pointer; font-size: 1rem; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2 id="page-title">Sélectionnez votre profil</h2>
        
        <div id="user-list" class="user-grid"></div>

        <div id="auth-section">
            <div id="selected-user-name" style="font-size: 1.4rem; margin-bottom: 20px; font-weight: bold; color: var(--accent);"></div>
            <div class="pin-view" id="pin-view">••••</div>
            <div class="numpad">
                <button class="num-btn" onclick="pressNum('1')">1</button>
                <button class="num-btn" onclick="pressNum('2')">2</button>
                <button class="num-btn" onclick="pressNum('3')">3</button>
                <button class="num-btn" onclick="pressNum('4')">4</button>
                <button class="num-btn" onclick="pressNum('5')">5</button>
                <button class="num-btn" onclick="pressNum('6')">6</button>
                <button class="num-btn" onclick="pressNum('7')">7</button>
                <button class="num-btn" onclick="pressNum('8')">8</button>
                <button class="num-btn" onclick="pressNum('9')">9</button>
                <button class="num-btn" style="color:#ef4444" onclick="pressNum('del')">←</button>
                <button class="num-btn" onclick="pressNum('0')">0</button>
                <button class="num-btn" style="color:#22c55e" onclick="validerConnexion()">OK</button>
            </div>
            <button class="btn-cancel" onclick="location.reload()">← Retour à la liste</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roleCible = params.get('role') || 'technicien';
        let currentPin = "";
        let selectedUser = null;

        function displayUsers(users) {
            const container = document.getElementById('user-list');
            if (!container) return;
            container.innerHTML = "";

            const filtres = users.filter(u => 
                u.role.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes(roleCible) 
                && u.username.toLowerCase() !== 'admin'
            );

            filtres.forEach(u => {
                const card = document.createElement('div');
                card.className = 'user-card';
                card.innerHTML = `<div class="user-name">${u.nom_complet}</div>`;
                card.onclick = () => {
                    selectedUser = u;
                    if(roleCible === 'referent') validerConnexion();
                    else showNumpad(u.nom_complet);
                };
                container.appendChild(card);
            });
        }

        function showNumpad(name) {
            document.getElementById('user-list').style.display = 'none';
            document.getElementById('page-title').style.display = 'none';
            document.getElementById('auth-section').style.display = 'block';
            document.getElementById('selected-user-name').innerText = name;
        }

        async function init() {
            // Affichage immédiat via cache
            const cached = localStorage.getItem(`cache_users_${roleCible}`);
            if(cached) displayUsers(JSON.parse(cached));

            // Mise à jour silencieuse
            try {
                const res = await fetch('/api/admin/users');
                const users = await res.json();
                displayUsers(users);
                localStorage.setItem(`cache_users_${roleCible}`, JSON.stringify(users));
            } catch (e) { console.log("Mode hors-ligne ou erreur serveur"); }
        }

        function pressNum(n) {
            if(n === 'del') currentPin = currentPin.slice(0, -1);
            else if(currentPin.length < 4) currentPin += n;
            document.getElementById('pin-view').innerText = "•".repeat(currentPin.length) || "••••";
        }

        async function validerConnexion() {
            const url = (roleCible === 'referent') ? '/api/login_sans_pin' : '/login_gmao';
            const res = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: selectedUser.username, password: currentPin })
            });
            const data = await res.json();
            if(data.status === "success") {
                localStorage.setItem('user_id', data.id);
                localStorage.setItem('user_nom', data.nom);
                window.location.href = (roleCible === 'referent') ? '/page_referent' : '/page_technicien';
            } else {
                alert("Code PIN incorrect");
                currentPin = ""; document.getElementById('pin-view').innerText = "••••";
            }
        }

        init();
    </script>
</body>
</html>
