<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GMAO - Identification Rapide</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="main-container">
        <h1>Qui êtes-vous ?</h1>
        <p style="color: var(--text-dim); margin-bottom: 2rem;">Accès direct à votre espace de saisie</p>

        <div class="grid-selection">
            <div class="card-user" onclick="connexionDirecte('Jean', 1)">
                <div class="avatar">J</div><span>Jean</span>
            </div>
            <div class="card-user" onclick="connexionDirecte('Marc', 2)">
                <div class="avatar">M</div><span>Marc</span>
            </div>
            <div class="card-user" onclick="connexionDirecte('Sophie', 3)">
                <div class="avatar">S</div><span>Sophie</span>
            </div>
            </div>
    </div>

    <script>
        function connexionDirecte(nom, id) {
            // On stocke l'identité localement sans demander de mot de passe
            localStorage.setItem('user_id', id);
            localStorage.setItem('user_nom', nom);
            localStorage.setItem('user_role', 'referent');
            
            // Redirection immédiate
            window.location.href = '/page_referent';
        }
    </script>
</body>
</html>
