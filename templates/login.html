<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMAO - Identification</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .grid-users { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; margin-top: 15px; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 250px; margin: 20px auto; }
        .key { width: 65px; height: 65px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .key:active { background: var(--accent-blue); }
        .dots { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
        .dot { width: 12px; height: 12px; border: 2px solid var(--accent-blue); border-radius: 50%; }
        .dot.active { background: var(--accent-blue); box-shadow: 0 0 10px var(--accent-blue); }
        
        /* Cacher les sections par défaut pour le filtrage */
        #section-tech, #section-ref { display: none; }
    </style>
</head>
<body>
    <div class="main-container">
        <div id="step-names">
            <h1 id="page-title">Identification</h1>
            
            <div id="section-tech">
                <h3 style="color: var(--accent-orange); text-align: left;">🛠️ Staff Technique</h3>
                <div class="grid-users">
                    <div class="card-user tech-card" onclick="showKeypad('Sébastien', 'technicien')"><div class="avatar tech-avatar">S</div><span>Sébastien</span></div>
                    <div class="card-user tech-card" onclick="showKeypad('Henri', 'technicien')"><div class="avatar tech-avatar">H</div><span>Henri</span></div>
                    <div class="card-user tech-card" onclick="showKeypad('Idryss', 'technicien')"><div class="avatar tech-avatar">I</div><span>Idryss</span></div>
                </div>
            </div>

            <div id="section-ref">
                <h3 style="color: var(--accent-blue); text-align: left; margin-top: 2rem;">👥 Référents Production</h3>
                <div class="grid-users">
                    <div class="card-user" onclick="showKeypad('Marine.B', 'referent')"><div class="avatar">MB</div><span>Marine.B</span></div>
                    <div class="card-user" onclick="showKeypad('Clarisse', 'referent')"><div class="avatar">C</div><span>Clarisse</span></div>
                    <div class="card-user" onclick="showKeypad('Marie-Laure', 'referent')"><div class="avatar">ML</div><span>M-Laure</span></div>
                    <div class="card-user" onclick="showKeypad('Karen', 'referent')"><div class="avatar">K</div><span>Karen</span></div>
                    <div class="card-user" onclick="showKeypad('Marine.C', 'referent')"><div class="avatar">MC</div><span>Marine.C</span></div>
                    <div class="card-user" onclick="showKeypad('Mélanie', 'referent')"><div class="avatar">M</div><span>Mélanie</span></div>
                    <div class="card-user" onclick="showKeypad('Anne-Marie', 'referent')"><div class="avatar">AM</div><span>A-Marie</span></div>
                    <div class="card-user" onclick="showKeypad('Nicolas', 'referent')"><div class="avatar">N</div><span>Nicolas</span></div>
                    <div class="card-user" onclick="showKeypad('Nassim', 'referent')"><div class="avatar">N</div><span>Nassim</span></div>
                </div>
            </div>
            
            <button onclick="window.location.href='/'" style="background:none; border:none; color:var(--text-dim); cursor:pointer; margin-top:30px;">← Retour</button>
        </div>

        <div id="step-pin" style="display:none;">
            <h1 id="welcome-name">Code PIN</h1>
            <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            <div class="keypad">
                <div class="key" onclick="pressKey('1')">1</div><div class="key" onclick="pressKey('2')">2</div><div class="key" onclick="pressKey('3')">3</div>
                <div class="key" onclick="pressKey('4')">4</div><div class="key" onclick="pressKey('5')">5</div><div class="key" onclick="pressKey('6')">6</div>
                <div class="key" onclick="pressKey('7')">7</div><div class="key" onclick="pressKey('8')">8</div><div class="key" onclick="pressKey('9')">9</div>
                <div class="key" onclick="cancelPin()">✕</div><div class="key" onclick="pressKey('0')">0</div><div class="key" onclick="clearPin()">⌫</div>
            </div>
        </div>
    </div>

    <script>
        let currentPin = "";
        let selectedName = "";
        let selectedRole = "";

        // FILTRAGE AU CHARGEMENT
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');
            
            if (role === 'technicien') {
                document.getElementById('section-tech').style.display = 'block';
                document.getElementById('page-title').innerText = "Accès Technicien";
            } else {
                document.getElementById('section-ref').style.display = 'block';
                document.getElementById('page-title').innerText = "Accès Référent";
            }
        }

        function showKeypad(name, role) {
            selectedName = name;
            selectedRole = role;
            document.getElementById('welcome-name').innerText = "Bonjour " + name;
            document.getElementById('step-names').style.display = 'none';
            document.getElementById('step-pin').style.display = 'block';
        }

        function cancelPin() {
            currentPin = ""; updateDots();
            document.getElementById('step-pin').style.display = 'none';
            document.getElementById('step-names').style.display = 'block';
        }

        function pressKey(num) {
            if (currentPin.length < 4) {
                currentPin += num;
                updateDots();
                if (currentPin.length === 4) verifyPin();
            }
        }

        function clearPin() { currentPin = currentPin.slice(0, -1); updateDots(); }

        function updateDots() {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => i < currentPin.length ? dot.classList.add('active') : dot.classList.remove('active'));
        }

        async function verifyPin() {
            const response = await fetch('/login_gmao', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: selectedName, password: currentPin })
            });
            const data = await response.json();
            if (data.status === "success") {
                localStorage.setItem('user_id', data.id);
                localStorage.setItem('user_nom', data.nom);
                localStorage.setItem('user_role', selectedRole);
                window.location.href = (selectedRole === 'technicien') ? '/page_technicien' : '/page_referent';
            } else {
                alert("Code PIN incorrect");
                currentPin = ""; updateDots();
            }
        }
    </script>
</body>
</html>
