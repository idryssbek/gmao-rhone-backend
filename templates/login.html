<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMAO - Connexion</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #1e293b; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #38bdf8; text-transform: uppercase; margin-bottom: 30px; }
        select, input { width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 10px; border: 2px solid #334155; background: #0f172a; color: white; font-size: 1rem; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; background: #38bdf8; color: white; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
        .back-link { display: block; margin-top: 20px; color: #64748b; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 id="role-title">Connexion</h2>
        
        <label style="display:block; text-align:left; margin-bottom:8px; color:#94a3b8;">Sélectionnez votre nom :</label>
        <select id="nom-select">
            <option value="">Chargement...</option>
        </select>

        <label style="display:block; text-align:left; margin-bottom:8px; color:#94a3b8;">Code PIN :</label>
        <input type="password" id="pin-input" placeholder="****" inputmode="numeric">

        <button onclick="tenterConnexion()">SE CONNECTER</button>
        
        <a href="/" class="back-link">← Retour au menu</a>
    </div>

    <script>
        // 1. Récupérer le rôle dans l'URL (ex: ?role=referent)
        const params = new URLSearchParams(window.location.search);
        const roleCible = params.get('role'); // "referent" ou "technicien"

        // Mise à jour du titre visuel
        if(roleCible) {
            document.getElementById('role-title').innerText = "Espace " + roleCible;
        }

        // 2. Charger les utilisateurs filtrés par rôle
        async function chargerUsers() {
            try {
                const res = await fetch('/api/admin/users');
                const users = await res.json();
                const select = document.getElementById('nom-select');
                select.innerHTML = '<option value="">-- Choisis ton nom --</option>';

                // FILTRAGE INTELLIGENT
                // On compare en minuscules pour éviter les erreurs de saisie dans l'admin
                const filtres = users.filter(u => u.role.toLowerCase() === roleCible.toLowerCase());

                if(filtres.length === 0) {
                    select.innerHTML = '<option value="">Aucun utilisateur trouvé</option>';
                }

                filtres.forEach(u => {
                    // On stocke le nom complet comme texte et le username (ou nom) comme valeur
                    let opt = new Option(u.nom_complet, u.username);
                    select.add(opt);
                });
            } catch (e) {
                console.error("Erreur chargement users:", e);
            }
        }

        // 3. Procédure de login
        async function tenterConnexion() {
            const user = document.getElementById('nom-select').value;
            const pin = document.getElementById('pin-input').value;

            if(!user || !pin) {
                alert("Sélectionne ton nom et entre ton code PIN");
                return;
            }

            const res = await fetch('/login_gmao', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username: user, password: pin })
            });

            const data = await res.json();

            if(data.status === "success") {
                // On enregistre les infos en local pour les formulaires suivants
                localStorage.setItem('user_id', data.id);
                localStorage.setItem('user_nom', data.nom);
                
                // Redirection selon le rôle
                if(data.role === 'referent') window.location.href = '/page_referent';
                else if(data.role === 'technicien') window.location.href = '/page_technicien';
                else window.location.href = '/admin';
            } else {
                alert("Code PIN incorrect !");
            }
        }

        // Lancement au chargement
        chargerUsers();
    </script>
</body>
</html>
