<!DOCTYPE html>
<html>
<head>
    <title>Connexion GMAO</title>
</head>
<body style="font-family:sans-serif; text-align:center; padding-top:100px; background:#f4f4f4;">
    <div style="background:white; display:inline-block; padding:30px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1);">
        <h2>Maintenance - Connexion</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Identifiant" required style="display:block; margin:10px auto; padding:10px; width:200px;"><br>
            <input type="password" name="password" placeholder="Mot de passe" required style="display:block; margin:10px auto; padding:10px; width:200px;"><br>
            <button type="submit" style="padding:10px 20px; background:blue; color:white; border:none; border-radius:5px; cursor:pointer;">Se connecter</button>
        </form>
        {% with messages = get_flashed_messages() %}
          {% if messages %}<p style="color:red;">{{ messages[0] }}</p>{% endif %}
        {% endwith %}
    </div>
</body>
</html>
