<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technicien - GMAO</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --success: #22c55e; --warning: #f59e0b; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
        
        header { background: var(--card); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; }
        .user-info { color: var(--accent); font-weight: bold; }
        .logout { color: #ef4444; text-decoration: none; font-size: 0.9rem; border: 1px solid #ef4444; padding: 5px 10px; border-radius: 6px; }

        .tabs { display: flex; background: var(--card); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        .tab-btn { flex: 1; padding: 18px 10px; border: none; background: none; color: #94a3b8; font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; font-size: 0.8rem; transition: 0.2s; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(56, 189, 248, 0.05); }

        .tab-content { flex: 1; overflow-y: auto; padding: 15px; display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }

        /* Formulaire */
        .form-card { background: var(--card); padding: 20px; border-radius: 15px; max-width: 500px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        label { display: block; margin: 12px 0 5px; color: var(--accent); font-size: 0.75rem; text-transform: uppercase; font-weight: bold; }
        select, input, textarea { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #334155; background: #0f172a; color: white; font-size: 1rem; box-sizing: border-box; }
        .btn-valider { width: 100%; padding: 18px; border-radius: 12px; border: none; background: var(--warning); color: white; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 15px; }

        /* Liste Interventions */
        .inter-item { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 12px; border-left: 6px solid #475569; position: relative; }
        .statut-en_attente { border-left-color: var(--warning); }
        .statut-saisi_gmao { border-left-color: var(--success); opacity: 0.8; }
        
        .item-header { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px; color: #94a3b8; }
        .item-title { font-weight: bold; font-size: 1.1rem; color: white; }
        .item-desc { color: #cbd5e1; font-size: 0.9rem; margin: 8px 0; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px; }
        
        .btn-action-ok { background: var(--success); color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        
        .badge-ref { color: var(--accent); font-size: 0.8rem; font-weight: bold; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <span class="user-info">🛠️ <span id="tech-nom">...</span></span>
        <a href="/" class="logout">Quitter</a>
    </header>

    <div class="tabs">
        <button id="btn-tab-todo" class="tab-btn active" onclick="switchTab('todo')">À VALIDER <span id="count-todo"></span></button>
        <button id="btn-tab-saisie" class="tab-btn" onclick="switchTab('saisie')">SAISIE DIRECTE</button>
        <button id="btn-tab-historique" class="tab-btn" onclick="switchTab('historique')">HISTORIQUE</button>
    </div>

    <div id="todo" class="tab-content active">
        <div id="liste-todo">
            <p style="text-align:center; color:#64748b; margin-top:20px;">Recherche de demandes en attente...</p>
        </div>
    </div>

    <div id="saisie" class="tab-content">
        <div class="form-card">
            <h3 style="margin-top:0; color:var(--accent)">Nouvelle Intervention</h3>
            <label>Ligne de production</label>
            <select id="ligne-select"><option value="">-- Sélectionner --</option></select>

            <label>Machine / Équipement</label>
            <input type="text" id="machine-input" placeholder="Ex: Presse-01">

            <label>Temps passé (minutes)</label>
            <input type="number" id="temps-input" placeholder="Ex: 30" inputmode="numeric">

            <label>Travaux réalisés</label>
            <textarea id="desc-input" placeholder="Décrivez votre intervention..."></textarea>

            <button class="btn-valider" onclick="envoyerIntervention()">ENREGISTRER (À VALIDER GMAO)</button>
        </div>
    </div>

    <div id="historique" class="tab-content">
        <div id="liste-interventions"></div>
    </div>

    <script>
        const techNom = localStorage.getItem('user_nom') || "Technicien";
        const techId = localStorage.getItem('user_id');
        let memoireTodo = "";
        let memoireHisto = "";

        document.getElementById('tech-nom').innerText = techNom;

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.getElementById('btn-tab-' + tabId).classList.add('active');
            refreshData();
        }

        async function chargerLignes() {
            const res = await fetch('/api/lignes');
            const lignes = await res.json();
            const select = document.getElementById('ligne-select');
            lignes.forEach(l => select.add(new Option(l.nom_ligne, l.nom_ligne)));
        }

        async function refreshData() {
            try {
                const res = await fetch('/api/historique_complet');
                const data = await res.json();

                // 1. FILTRE "À FAIRE" (EN ATTENTE)
                const todoData = data.filter(i => i.statut === 'en_attente');
                const todoHtml = todoData.length === 0 ? 
                    "<p style='text-align:center; color:#64748b; margin-top:40px;'>☕ Aucune demande en attente.</p>" :
                    todoData.map(i => `
                        <div class="inter-item statut-en_attente">
                            <div class="item-header">
                                <span>${new Date(i.date_saisie).toLocaleString('fr-FR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})}</span>
                                <span class="badge-ref">Émetteur: ${i.nom_referent || i.nom_operateur_intervenant || 'N/C'}</span>
                            </div>
                            <div class="item-title">${i.ligne_production} - ${i.machine_num}</div>
                            <div class="item-desc">${i.description}</div>
                            <button class="btn-action-ok" onclick="validerGmao(${i.id})">VALIDER DANS GMAO ✅</button>
                        </div>
                    `).join('');
                
                if(memoireTodo !== todoHtml) {
                    document.getElementById('liste-todo').innerHTML = todoHtml;
                    memoireTodo = todoHtml;
                    document.getElementById('count-todo').innerText = todoData.length > 0 ? `(${todoData.length})` : "";
                }

                // 2. FILTRE "HISTORIQUE" (TOUT)
                const histoHtml = data.map(i => `
                    <div class="inter-item statut-${i.statut}">
                        <div class="item-header">
                            <span>${new Date(i.date_saisie).toLocaleDateString()}</span>
                            <span style="font-weight:bold; color:${i.statut === 'en_attente'?'var(--warning)':'var(--success)'}">
                                ${i.statut === 'en_attente' ? 'À VALIDER' : 'SAISI GMAO'}
                            </span>
                        </div>
                        <div class="item-title">${i.ligne_production} - ${i.machine_num}</div>
                        <div class="item-desc">${i.description}</div>
                        <div style="font-size:0.75rem; color:var(--accent)">Émetteur: ${i.nom_referent || i.nom_operateur_intervenant || 'N/C'}</div>
                    </div>
                `).join('');

                if(memoireHisto !== histoHtml) {
                    document.getElementById('liste-interventions').innerHTML = histoHtml;
                    memoireHisto = histoHtml;
                }

            } catch (e) { console.error("Erreur sync"); }
        }

        async function validerGmao(id) {
            const res = await fetch('/api/cloturer_gmao', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id_intervention: id, id_tech: techId, statut: 'saisi_gmao' })
            });
            if(res.ok) refreshData();
        }

        async function envoyerIntervention() {
            const ligne = document.getElementById('ligne-select').value;
            const machine = document.getElementById('machine-input').value;
            const temps = document.getElementById('temps-input').value;
            const desc = document.getElementById('desc-input').value;

            if(!ligne || !machine || !desc) { alert("Champs obligatoires !"); return; }

            const res = await fetch('/api/save_intervention', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    ligne: ligne, 
                    machine: machine, 
                    nom_op: techNom,
                    description: `${desc} (Durée: ${temps || 0} min)`,
                    id_referent: techId,
                    statut: 'en_attente' // MODIFIÉ : Enregistré en attente pour forcer la validation manuelle
                })
            });

            if(res.ok) {
                alert("Intervention enregistrée ! Pensez à la valider dans l'onglet 'À VALIDER' une fois saisie en GMAO.");
                document.getElementById('machine-input').value = "";
                document.getElementById('desc-input').value = "";
                document.getElementById('temps-input').value = "";
                switchTab('todo');
            }
        }

        chargerLignes();
        refreshData();
        setInterval(refreshData, 3000); // Live toutes les 3 secondes
    </script>
</body>
</html>
