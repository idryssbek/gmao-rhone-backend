<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMAO - Espace Technicien</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .inter-card {
            background: #1a1f26; border: 1px solid #2d353f; padding: 15px;
            border-radius: 10px; margin-bottom: 15px; display: flex;
            justify-content: space-between; align-items: center;
        }
        .inter-info { flex: 1; }
        .status-badge { 
            padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; font-weight: bold;
        }
        .status-attente { background: #f59e0b; color: #000; }
        .status-valide { background: #10b981; color: #fff; }
        .btn-valider { 
            background: #38bdf8; color: black; border: none; padding: 10px 15px;
            border-radius: 6px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h2 style="margin:0; color:#38bdf8;">ESPACE TECHNIQUE</h2>
                <p id="user-display" style="color:#8b949e; margin:0;"></p>
            </div>
            <button onclick="window.location.href='/'">Sortir</button>
        </header>

        <h3 style="color: #fff; border-bottom: 1px solid #333; padding-bottom: 5px;">Interventions à valider</h3>
        <div id="liste-interventions">
            <p style="color:#666;">Chargement des données...</p>
        </div>
    </div>

    <script>
        document.getElementById('user-display').innerText = "Technicien : " + localStorage.getItem('user_nom');

        async function loadInterventions() {
            try {
                const res = await fetch('/api/historique_complet');
                const data = await res.json();
                const container = document.getElementById('liste-interventions');
                container.innerHTML = "";

                // On ne montre que les interventions "en attente" ou récentes
                data.forEach(i => {
                    const isAttente = i.statut === 'en_attente';
                    const card = document.createElement('div');
                    card.className = 'inter-card';
                    
                    card.innerHTML = `
                        <div class="inter-info">
                            <div style="font-weight:bold; color:#38bdf8;">${i.ligne_production} - ${i.machine_num}</div>
                            <div style="font-size:0.9rem; margin:5px 0;">${i.description}</div>
                            <div style="font-size:0.8rem; color:#666;">Par: ${i.nom_operateur_intervenant}</div>
                        </div>
                        <div>
                            ${isAttente 
                                ? `<button class="btn-valider" onclick="validerInter(${i.id})">VALIDER</button>`
                                : `<span class="status-badge status-valide">SAISI GMAO</span>`
                            }
                        </div>
                    `;
                    container.appendChild(card);
                });

                if(data.length === 0) {
                    container.innerHTML = "<p style='color:#666;'>Aucune intervention enregistrée.</p>";
                }
            } catch (err) {
                console.error("Erreur:", err);
            }
        }

        async function validerInter(idInter) {
            const nomTech = localStorage.getItem('user_nom');
            
            const res = await fetch('/api/cloturer_gmao', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    id_intervention: idInter,
                    id_tech: nomTech
                })
            });

            if(res.ok) {
                loadInterventions(); // Rafraîchir la liste
            } else {
                alert("Erreur lors de la validation");
            }
        }

        // Charger au démarrage
        loadInterventions();
        // Rafraîchir toutes les 30 secondes automatiquement
        setInterval(loadInterventions, 30000);
    </script>
</body>
</html>
