<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMAO - Espace Tech</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .tech-box { background: #1a1f26; border: 1px solid #2d353f; border-radius: 12px; padding: 20px; margin-bottom: 25px; }
        .input-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        input, select { background: #0d1117; border: 1px solid #333; color: white; padding: 12px; border-radius: 6px; flex: 1; min-width: 150px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; color: #fb923c; padding: 12px; border-bottom: 2px solid #2d353f; font-size: 0.8rem; }
        td { padding: 12px; border-bottom: 1px solid #2d353f; font-size: 0.9rem; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        .todo { border: 1px solid #fb923c; color: #fb923c; }
        .done { border: 1px solid #10b981; color: #10b981; }
        .btn-validate { background: #38bdf8; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="main-container">
        <header style="display:flex; justify-content: space-between; align-items: center; margin-bottom:20px;">
            <h1 style="color: #fb923c;">Dashboard Maintenance</h1>
            <button onclick="window.location.href='/'" class="btn-secondary">Sortir</button>
        </header>

        <div class="tech-box">
            <h3 style="margin:0;">🛠️ Saisie Rapide Technicien</h3>
            <div class="input-group">
                <select id="t-ligne">
                    <option value="Ligne A">Ligne A</option><option value="Ligne B">Ligne B</option>
                    <option value="Ligne C">Ligne C</option><option value="Ligne D">Ligne D</option>
                </select>
                <input type="text" id="t-machine" placeholder="N° Machine (ex: M01)">
                <input type="text" id="t-temps" placeholder="Durée (ex: 45min)">
                <input type="text" id="t-desc" placeholder="Nature du travail...">
            </div>
            <button onclick="saveTechInter()" style="width:100%; margin-top:15px; padding:12px; background:#fb923c; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">ENREGISTRER MON INTERVENTION</button>
        </div>

        <div class="tech-box">
            <h3 style="margin-bottom:15px; color:#38bdf8;">📋 Suivi des saisies GMAO</h3>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>DATE</th>
                            <th>LIGNE</th>
                            <th>MACHINE</th>
                            <th>AUTEUR</th>
                            <th>DESCRIPTION / TEMPS</th>
                            <th>STATUT</th>
                            <th>ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="tech-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const myName = localStorage.getItem('user_nom');
        const myId = localStorage.getItem('user_id');

        async function loadTable() {
            const res = await fetch('/api/historique_complet');
            const data = await res.json();
            const tbody = document.getElementById('tech-table-body');
            tbody.innerHTML = "";
            data.forEach(i => {
                const isDone = i.statut === 'saisi_gmao';
                tbody.innerHTML += `
                    <tr>
                        <td>${new Date(i.date_saisie).toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})}</td>
                        <td style="color:#38bdf8">${i.ligne_production}</td>
                        <td><b>${i.machine_num}</b></td>
                        <td>${i.nom_complet || i.nom_operateur_intervenant}</td>
                        <td>${i.description}</td>
                        <td><span class="status-badge ${isDone?'done':'todo'}">${isDone?'SAISI':'À SAISIR'}</span></td>
                        <td>${!isDone? `<button class="btn-validate" onclick="validerGmao(${i.id})">VALIDER</button>` : '✅'}</td>
                    </tr>
                `;
            });
        }

        async function saveTechInter() {
            const desc = document.getElementById('t-desc').value;
            const mach = document.getElementById('t-machine').value;
            const temp = document.getElementById('t-temps').value;
            if(!desc || !mach) return alert("Remplissez Machine et Description");

            await fetch('/api/save_intervention', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    ligne: document.getElementById('t-ligne').value,
                    machine: mach, nom_op: myName,
                    description: desc + " (Temps: " + temp + ")",
                    id_referent: myId
                })
            });
            document.getElementById('t-desc').value = ""; document.getElementById('t-machine').value = "";
            loadTable();
        }

        async function validerGmao(id) {
            await fetch('/api/cloturer_gmao', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id_intervention: id, id_tech: myName })
            });
            loadTable();
        }
        loadTable();
    </script>
</body>
</html>
