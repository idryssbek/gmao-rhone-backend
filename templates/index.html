<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMAO - Accueil</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .btn-access {
            height: 200px;
            border-radius: 15px;
            border: none;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .btn-referent { background: #10b981; } /* Vert */
        .btn-technicien { background: #38bdf8; } /* Bleu */
        .btn-access:active { transform: scale(0.95); }
        .icon { font-size: 3rem; }
    </style>
</head>
<body>
    <div class="main-container" style="text-align: center; margin-top: 50px;">
        <h1 style="color: white; margin-bottom: 40px;">SÉLECTIONNEZ VOTRE ESPACE</h1>
        
        <div class="menu-grid">
            <button class="btn-access btn-referent" onclick="window.location.href='/login?role=referent'">
                <span class="icon">📋</span>
                <span>RÉFÉRENT</span>
            </button>

            <button class="btn-access btn-technicien" onclick="window.location.href='/login?role=technicien'">
                <span class="icon">🔧</span>
                <span>TECHNICIEN</span>
            </button>
        </div>

        <p style="color: #444; margin-top: 50px; font-size: 0.8rem;">GMAO Interne - Accès sécurisé</p>
    </div>
</body>
</html>
