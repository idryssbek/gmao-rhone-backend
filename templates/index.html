<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GMAO - Accueil</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="main-container">
        <h1>Portail GMAO</h1>
        <p style="color: var(--text-dim); margin-bottom: 3rem;">Sélectionnez votre espace de travail</p>

        <div class="grid-selection" style="grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));">
            
            <div class="card" onclick="window.location.href='/page_operateur'">
                <div class="icon">👤</div>
                <h3>Opérateur</h3>
                <p>Signaler un problème machine rapidement</p>
            </div>

            <div class="card" onclick="window.location.href='/login?role=referent'">
                <div class="icon" style="filter: drop-shadow(0 0 10px var(--accent-blue));">👥</div>
                <h3>Référent</h3>
                <p>Saisir et suivre les interventions</p>
            </div>

            <div class="card tech-card" onclick="window.location.href='/login?role=technicien'">
                <div class="icon" style="filter: drop-shadow(0 0 10px var(--accent-orange));">🛠️</div>
                <h3 style="color: var(--accent-orange);">Technicien</h3>
                <p>Valider et clôturer les interventions</p>
            </div>

        </div>
    </div>
</body>
</html>
